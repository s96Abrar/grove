name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only. Tagged releases still build and verify the x86_64
        # slice (scripts/release.py, scripts/verify_app.py); it is not executed in CI.
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    # A normal run takes ~8 minutes; fail a hung run quickly instead of after 45.
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GROVE_RUN_GUI_CHECKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax and expressions
        run: bash scripts/lint-workflows.sh
      - name: Install persistent terminal dependency
        run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      # SwiftPM build products (mostly SwiftTerm) take ~5 of the ~8 minutes.
      # Keyed on toolchain + pinned dependencies; sources only pick the newest
      # entry, and SwiftPM rebuilds whatever changed. Tagged release artifacts
      # are still built from scratch in release.yml's own job.
      - name: Restore SwiftPM build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .build/review-tests
            .build/release-arm64
          key: swiftpm-${{ matrix.os }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**', 'Resources/**') }}
          restore-keys: |
            swiftpm-${{ matrix.os }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Check, package and exercise actual app
        run: bash scripts/check.sh
      - name: Create local delivery archive
        run: python3 scripts/release.py --mode local
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Grove-local-${{ matrix.os }}
          path: dist/releases/
          if-no-files-found: error
          retention-days: 14
